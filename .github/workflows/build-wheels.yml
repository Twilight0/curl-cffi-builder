name: Build Mobile Wheels and Kodi Addon

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Wheels (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for AArch64
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Clone curl_cffi
        run: |
          git clone --depth 1 https://github.com/lexiforest/curl_cffi.git curl_cffi_src

      - name: Build Wheel using cibuildwheel
        uses: pypa/cibuildwheel@v2.16.5
        with:
          package-dir: curl_cffi_src
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_BUILD: "cp310-manylinux*"

      - name: Upload Linux Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: curl-cffi-linux-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build-desktop-windows:
    name: Download Windows Wheel
    runs-on: windows-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download PyPI Wheel
        run: |
          mkdir dist
          python -m pip download curl_cffi==0.6.0 --only-binary=:all: -d dist/

      - name: Upload Windows Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: curl-cffi-windows-x64
          path: dist/*.whl

  package-kodi-addon:
    name: Package Kodi Addon (script.module.curlcffi)
    needs: [build-linux, build-desktop-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download All Platform Wheels
        uses: actions/download-artifact@v4
        with:
          path: all_wheels

      - name: Assemble Kodi Binary Addon
        run: |
          python3 ./scripts/build_kodi_addon.py

      - name: Upload Kodi Addon Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: script.module.curlcffi-addon
          path: dist/*.zip

      - name: Release Kodi Addon Zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            all_wheels/**/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
