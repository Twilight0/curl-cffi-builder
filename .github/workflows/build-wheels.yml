name: Build Mobile Wheels and Kodi Addon

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  download-pypi-wheels:
    name: Download PyPI Multi-Arch Wheels (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - manylinux_2_17_x86_64
          - manylinux_2_17_aarch64
          - win_amd64
          - macosx_11_0_arm64

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Wheel from PyPI
        run: |
          mkdir -p dist
          python -m pip download curl_cffi==0.6.0 --only-binary=:all: --platform ${{ matrix.platform }} --python-version 3.10 --no-deps -d dist/ || \
          python -m pip download curl_cffi==0.6.0 --only-binary=:all: -d dist/

      - name: Upload Platform Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: curl-cffi-${{ matrix.platform }}
          path: dist/*.whl

  build-android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Android Wheel
        run: |
          chmod +x ./scripts/build_android.sh
          ./scripts/build_android.sh ${{ matrix.abi }} || true

      - name: Upload Android Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: curl-cffi-android-${{ matrix.abi }}
          path: dist/*.whl

  build-ios:
    name: Build iOS Static Package (arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build iOS Static Package
        run: |
          chmod +x ./scripts/build_ios.sh
          ./scripts/build_ios.sh

      - name: Upload iOS Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: curl-cffi-ios-arm64-static
          path: dist/*.zip

  package-kodi-addon:
    name: Package Kodi Addon (script.module.curlcffi)
    needs: [download-pypi-wheels, build-android, build-ios]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download All Platform Wheels
        uses: actions/download-artifact@v4
        with:
          path: all_wheels

      - name: Assemble Kodi Binary Addon
        run: |
          python3 ./scripts/build_kodi_addon.py

      - name: Upload Kodi Addon Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: script.module.curlcffi-addon
          path: dist/*.zip

      - name: Release Kodi Addon Zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            all_wheels/**/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
