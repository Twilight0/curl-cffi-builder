name: Build Mobile Wheels for curl_cffi

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Android NDK
        uses: nsetup/setup-android-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Android Wheel
        run: |
          chmod +x ./scripts/build_android.sh
          ./scripts/build_android.sh ${{ matrix.abi }}

      - name: Upload Android Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: curl-cffi-android-${{ matrix.abi }}
          path: dist/*.whl

  build-ios:
    name: Build iOS (arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build iOS Wheel
        run: |
          chmod +x ./scripts/build_ios.sh
          ./scripts/build_ios.sh

      - name: Upload iOS Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: curl-cffi-ios-arm64
          path: dist/*.whl

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_wheels

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_wheels/**/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
