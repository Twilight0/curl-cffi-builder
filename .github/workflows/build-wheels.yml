name: Build Mobile Wheels and Kodi Addon

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Android Wheel
        run: |
          chmod +x ./scripts/build_android.sh
          ./scripts/build_android.sh ${{ matrix.abi }}

      - name: Upload Android Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: curl-cffi-android-${{ matrix.abi }}
          path: dist/*.whl

  build-ios:
    name: Build iOS (arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build iOS Wheel
        run: |
          chmod +x ./scripts/build_ios.sh
          ./scripts/build_ios.sh

      - name: Upload iOS Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: curl-cffi-ios-arm64
          path: dist/*.whl

  build-desktop:
    name: Download Desktop Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download PyPI Wheel
        run: |
          mkdir -p dist
          python -m pip download curl_cffi==0.6.0 --only-binary=:all: -d dist/

      - name: Upload Desktop Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: curl-cffi-desktop-${{ matrix.os }}
          path: dist/*.whl

  package-kodi-addon:
    name: Package Kodi Addon (script.module.curlcffi)
    needs: [build-android, build-ios, build-desktop]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download All Platform Wheels
        uses: actions/download-artifact@v4
        with:
          path: all_wheels

      - name: Assemble Kodi Binary Addon
        run: |
          python3 ./scripts/build_kodi_addon.py

      - name: Upload Kodi Addon Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: script.module.curlcffi-addon
          path: dist/*.zip

      - name: Release Kodi Addon Zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            all_wheels/**/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
